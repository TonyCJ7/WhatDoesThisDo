name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  editor-builtin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npx vscode-test --label builtin

  editor-servers:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npx vscode-test --label servers

  setup-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh setup/test-setup.sh setup/setup-linux.sh

  setup-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh setup/test-setup.sh setup/setup-macos.sh

  setup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -File setup/test-setup.ps1
